<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="360" height="740">
  <defs>
    <style>
      .bg { fill: #121212; }
      .surface { fill: #1E1E1E; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="360" height="740"/>

  <!-- Toolbar (actionBarSize ~56dp, bg #1E1E1E) -->
  <rect x="0" y="0" width="360" height="56" fill="#1E1E1E"/>
  <!-- Back arrow -->
  <path d="M20,28 L28,20 L28,36" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28,28 L36,28" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <!-- Title -->
  <text x="44" y="36" font-family="system-ui,sans-serif" font-size="18" fill="#FFFFFF">README.md</text>
  <!-- Annotation drawer icon (ic_annotation_drawer, 24dp, tint white) at right -->
  <g transform="translate(316, 16)">
    <path d="M3,18 h18 v-2 H3 v2 z m0,-5 h18 v-2 H3 v2 z m0,-7 v2 h18 V6 H3 z" fill="#FFFFFF"/>
  </g>

  <!-- ScrollView content (padding 16dp, lineSpacingMultiplier 1.5) -->
  <!-- H1 heading -->
  <text x="16" y="88" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">MarkShell</text>

  <!-- Paragraph -->
  <text x="16" y="120" font-family="system-ui,sans-serif" font-size="14" fill="#E0E0E0">Android SSH Markdown 阅读器</text>
  <text x="16" y="142" font-family="system-ui,sans-serif" font-size="14" fill="#E0E0E0">通过 SSH/SFTP 连接远程服务器</text>

  <!-- H2 heading -->
  <text x="16" y="180" font-family="system-ui,sans-serif" font-size="18" font-weight="bold" fill="#E0E0E0">功能特性</text>

  <!-- List items -->
  <text x="16" y="212" font-family="system-ui,sans-serif" font-size="14" fill="#E0E0E0">• Markdown 渲染</text>
  <text x="16" y="238" font-family="system-ui,sans-serif" font-size="14" fill="#E0E0E0">• 代码语法高亮</text>

  <!-- Annotated text with yellow dashed underline -->
  <text x="16" y="264" font-family="system-ui,sans-serif" font-size="14" fill="#E0E0E0">• 文本批注功能</text>
  <line x1="14" y1="270" x2="112" y2="270" stroke="#FFD600" stroke-width="1.5" stroke-dasharray="5 3"/>

  <!-- Annotation popup (bg_popup_annotation, 8dp radius, #1E1E1E) -->
  <rect x="140" y="248" width="200" height="64" rx="8" fill="#1E1E1E"/>
  <text x="156" y="266" font-family="system-ui,sans-serif" font-size="11" fill="#BB86FC">批注</text>
  <text x="156" y="284" font-family="system-ui,sans-serif" font-size="13" fill="#E0E0E0">选中文本即可</text>
  <text x="156" y="302" font-family="system-ui,sans-serif" font-size="13" fill="#E0E0E0">添加批注内容</text>

  <!-- More list items -->
  <text x="16" y="336" font-family="system-ui,sans-serif" font-size="14" fill="#E0E0E0">• 图片查看器</text>
  <text x="16" y="362" font-family="system-ui,sans-serif" font-size="14" fill="#E0E0E0">• CSV 表格渲染</text>

  <!-- Code block (bg #2A2A2A) -->
  <rect x="16" y="384" width="328" height="48" rx="6" fill="#2A2A2A"/>
  <text x="28" y="404" font-family="monospace" font-size="12" fill="#4FC3F7">const</text>
  <text x="72" y="404" font-family="monospace" font-size="12" fill="#81C784">app</text>
  <text x="100" y="404" font-family="monospace" font-size="12" fill="#E0E0E0"> = </text>
  <text x="120" y="404" font-family="monospace" font-size="12" fill="#FFB74D">'MarkShell'</text>
  <text x="28" y="422" font-family="monospace" font-size="12" fill="#4FC3F7">export</text>
  <text x="80" y="422" font-family="monospace" font-size="12" fill="#E0E0E0">default app</text>

  <!-- More text -->
  <text x="16" y="460" font-family="system-ui,sans-serif" font-size="14" fill="#E0E0E0">支持双指缩放调节字体</text>

  <!-- Caption -->
  <text x="180" y="724" font-family="system-ui,sans-serif" font-size="12" fill="#666666" text-anchor="middle">Markdown 阅读器 · 批注高亮</text>
</svg>
