<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" width="320" height="640">
  <!-- Phone frame -->
  <rect x="0" y="0" width="320" height="640" rx="24" fill="#121212"/>
  <rect x="0" y="0" width="320" height="56" rx="24" fill="#1E1E1E"/>
  <rect x="0" y="36" width="320" height="20" fill="#1E1E1E"/>

  <!-- Status bar -->
  <text x="16" y="34" font-family="system-ui" font-size="11" fill="#A0A0A0">9:41</text>
  <text x="284" y="34" font-family="system-ui" font-size="11" fill="#A0A0A0">100%</text>

  <!-- Toolbar -->
  <text x="16" y="50" font-family="system-ui" font-size="18" fill="#FFFFFF">‹</text>
  <text x="40" y="50" font-family="system-ui" font-size="14" fill="#E0E0E0">README.md</text>
  <!-- Drawer icon -->
  <rect x="284" y="38" width="20" height="20" rx="3" fill="none" stroke="#BB86FC" stroke-width="1.5"/>
  <line x1="288" y1="44" x2="300" y2="44" stroke="#BB86FC" stroke-width="1.5"/>
  <line x1="288" y1="48" x2="300" y2="48" stroke="#BB86FC" stroke-width="1.5"/>
  <line x1="288" y1="52" x2="296" y2="52" stroke="#BB86FC" stroke-width="1.5"/>

  <!-- Markdown content area -->
  <!-- H1 -->
  <text x="16" y="84" font-family="system-ui" font-size="18" font-weight="bold" fill="#FFFFFF"># MarkShell</text>

  <!-- Paragraph line 1 -->
  <text x="16" y="108" font-family="system-ui" font-size="13" fill="#E0E0E0">Android SSH Markdown 阅读器</text>

  <!-- Paragraph line 2 -->
  <text x="16" y="128" font-family="system-ui" font-size="13" fill="#E0E0E0">通过 SSH 连接远程服务器</text>

  <!-- H2 -->
  <text x="16" y="160" font-family="system-ui" font-size="15" font-weight="bold" fill="#BB86FC">## 功能特性</text>

  <!-- List items -->
  <text x="16" y="184" font-family="system-ui" font-size="13" fill="#E0E0E0">- Markdown 渲染</text>
  <text x="16" y="204" font-family="system-ui" font-size="13" fill="#E0E0E0">- 代码语法高亮</text>

  <!-- Annotated text with yellow dashed underline -->
  <text x="16" y="232" font-family="system-ui" font-size="13" fill="#E0E0E0">- 文本批注功能</text>
  <line x1="14" y1="236" x2="100" y2="236" stroke="#FFD600" stroke-width="1.5" stroke-dasharray="4 2.5"/>

  <!-- Annotation popup bubble -->
  <rect x="120" y="218" width="160" height="56" rx="10" fill="#1E1E1E" stroke="#BB86FC" stroke-width="1"/>
  <text x="132" y="234" font-family="system-ui" font-size="10" fill="#BB86FC">批注</text>
  <text x="132" y="252" font-family="system-ui" font-size="12" fill="#E0E0E0">这里支持选中</text>
  <text x="132" y="266" font-family="system-ui" font-size="12" fill="#E0E0E0">文本添加批注</text>

  <!-- More list items -->
  <text x="16" y="296" font-family="system-ui" font-size="13" fill="#E0E0E0">- 图片查看器</text>
  <text x="16" y="316" font-family="system-ui" font-size="13" fill="#E0E0E0">- CSV 表格渲染</text>

  <!-- Code block -->
  <rect x="16" y="336" width="288" height="56" rx="8" fill="#2A2A2A"/>
  <text x="28" y="356" font-family="monospace" font-size="11" fill="#4FC3F7">const</text>
  <text x="70" y="356" font-family="monospace" font-size="11" fill="#81C784">app</text>
  <text x="98" y="356" font-family="monospace" font-size="11" fill="#E0E0E0">= </text>
  <text x="116" y="356" font-family="monospace" font-size="11" fill="#FFB74D">'MarkShell'</text>
  <text x="28" y="376" font-family="monospace" font-size="11" fill="#4FC3F7">export</text>
  <text x="78" y="376" font-family="monospace" font-size="11" fill="#E0E0E0">default app</text>

  <!-- More text -->
  <text x="16" y="416" font-family="system-ui" font-size="13" fill="#E0E0E0">支持双指缩放调节字体</text>

  <!-- Caption -->
  <text x="160" y="620" font-family="system-ui" font-size="12" fill="#666666" text-anchor="middle">Markdown 阅读器 · 批注高亮</text>
</svg>
