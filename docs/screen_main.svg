<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="360" height="740">
  <defs>
    <style>
      .bg { fill: #121212; }
      .surface { fill: #1E1E1E; }
      .primary { fill: #BB86FC; }
      .text-primary { fill: #E0E0E0; }
      .text-secondary { fill: #A0A0A0; }
      .text-dim { fill: #666666; }
      .divider { fill: #333333; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="360" height="740"/>

  <!-- Header (item_home_header: paddingTop=48, paddingStart=20, paddingBottom=12) -->
  <text x="20" y="68" font-family="system-ui,sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" letter-spacing="-0.5">MarkShell</text>
  <text x="20" y="90" font-family="system-ui,sans-serif" font-size="13" fill="#A0A0A0">2 个连接</text>

  <!-- Connection card 1 (bg_card #1E1E1E, 12dp radius, margin 12/6, padding 16) -->
  <rect x="12" y="104" width="336" height="88" rx="12" fill="#1E1E1E"/>
  <!-- ic_ssh_connection icon (28dp, tint #BB86FC) at padding 16 -->
  <g transform="translate(28, 120) scale(1.17)" stroke="#BB86FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M8,7 L13,12 L8,17"/>
    <path d="M16,10 L21,10"/>
    <path d="M16,14 L19,14"/>
  </g>
  <!-- Text block, marginStart=14 from icon (28+14=42+16=58) -->
  <text x="58" y="134" font-family="system-ui,sans-serif" font-size="14" fill="#E0E0E0">192.168.1.100:22</text>
  <text x="58" y="154" font-family="system-ui,sans-serif" font-size="12" fill="#A0A0A0">root</text>
  <text x="58" y="172" font-family="system-ui,sans-serif" font-size="12" fill="#A0A0A0">/home/user/docs</text>

  <!-- Connection card 2 -->
  <rect x="12" y="200" width="336" height="88" rx="12" fill="#1E1E1E"/>
  <g transform="translate(28, 216) scale(1.17)" stroke="#BB86FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M8,7 L13,12 L8,17"/>
    <path d="M16,10 L21,10"/>
    <path d="M16,14 L19,14"/>
  </g>
  <text x="58" y="230" font-family="system-ui,sans-serif" font-size="14" fill="#E0E0E0">10.0.0.50:22</text>
  <text x="58" y="250" font-family="system-ui,sans-serif" font-size="12" fill="#A0A0A0">dev</text>
  <text x="58" y="268" font-family="system-ui,sans-serif" font-size="12" fill="#A0A0A0">/var/www/html</text>

  <!-- Connection card 3 -->
  <rect x="12" y="296" width="336" height="88" rx="12" fill="#1E1E1E"/>
  <g transform="translate(28, 312) scale(1.17)" stroke="#BB86FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M8,7 L13,12 L8,17"/>
    <path d="M16,10 L21,10"/>
    <path d="M16,14 L19,14"/>
  </g>
  <text x="58" y="326" font-family="system-ui,sans-serif" font-size="14" fill="#E0E0E0">172.16.0.8:2222</text>
  <text x="58" y="346" font-family="system-ui,sans-serif" font-size="12" fill="#A0A0A0">test</text>
  <text x="58" y="364" font-family="system-ui,sans-serif" font-size="12" fill="#A0A0A0">/opt/app/config</text>

  <!-- FAB (bottom|end, margin 20, #BB86FC, 56dp) -->
  <circle cx="304" cy="664" r="28" fill="#BB86FC"/>
  <path d="M304,648 v32 M288,664 h32" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Caption -->
  <text x="180" y="724" font-family="system-ui,sans-serif" font-size="12" fill="#666666" text-anchor="middle">首页 · 连接列表</text>
</svg>
