<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" width="320" height="640">
  <!-- Phone frame -->
  <rect x="0" y="0" width="320" height="640" rx="24" fill="#121212"/>
  <rect x="0" y="0" width="320" height="56" rx="24" fill="#1E1E1E"/>
  <rect x="0" y="36" width="320" height="20" fill="#1E1E1E"/>

  <!-- Status bar -->
  <text x="16" y="34" font-family="system-ui" font-size="11" fill="#A0A0A0">9:41</text>
  <text x="284" y="34" font-family="system-ui" font-size="11" fill="#A0A0A0">100%</text>

  <!-- Toolbar -->
  <text x="16" y="50" font-family="system-ui" font-size="18" font-weight="bold" fill="#FFFFFF">MarkShell</text>
  <circle cx="296" cy="44" r="14" fill="#BB86FC"/>
  <text x="291" y="49" font-family="system-ui" font-size="16" fill="#000000">+</text>

  <!-- Section label -->
  <text x="16" y="80" font-family="system-ui" font-size="13" fill="#A0A0A0">已保存的连接</text>

  <!-- Connection card 1 -->
  <rect x="12" y="92" width="296" height="72" rx="12" fill="#1E1E1E"/>
  <rect x="12" y="92" width="4" height="72" rx="2" fill="#4CAF50"/>
  <text x="28" y="116" font-family="system-ui" font-size="15" font-weight="600" fill="#E0E0E0">生产服务器</text>
  <text x="28" y="136" font-family="system-ui" font-size="12" fill="#A0A0A0">root@192.168.1.100:22</text>
  <text x="28" y="152" font-family="system-ui" font-size="11" fill="#4CAF50">● 已连接</text>

  <!-- Connection card 2 -->
  <rect x="12" y="176" width="296" height="72" rx="12" fill="#1E1E1E"/>
  <rect x="12" y="176" width="4" height="72" rx="2" fill="#555555"/>
  <text x="28" y="200" font-family="system-ui" font-size="15" font-weight="600" fill="#E0E0E0">开发机</text>
  <text x="28" y="220" font-family="system-ui" font-size="12" fill="#A0A0A0">dev@10.0.0.50:22</text>
  <text x="28" y="236" font-family="system-ui" font-size="11" fill="#666666">● 未连接</text>

  <!-- Connection card 3 -->
  <rect x="12" y="260" width="296" height="72" rx="12" fill="#1E1E1E"/>
  <rect x="12" y="260" width="4" height="72" rx="2" fill="#555555"/>
  <text x="28" y="284" font-family="system-ui" font-size="15" font-weight="600" fill="#E0E0E0">测试环境</text>
  <text x="28" y="304" font-family="system-ui" font-size="12" fill="#A0A0A0">test@172.16.0.8:2222</text>
  <text x="28" y="320" font-family="system-ui" font-size="11" fill="#666666">● 未连接</text>

  <!-- Quick connect button -->
  <rect x="12" y="356" width="296" height="48" rx="12" fill="#BB86FC"/>
  <text x="120" y="386" font-family="system-ui" font-size="15" font-weight="600" fill="#000000">快速连接</text>

  <!-- Bottom hint -->
  <text x="80" y="440" font-family="system-ui" font-size="12" fill="#555555">点击 + 新建 SSH 连接</text>

  <!-- Caption -->
  <text x="160" y="620" font-family="system-ui" font-size="12" fill="#666666" text-anchor="middle">首页 · 连接列表</text>
</svg>
